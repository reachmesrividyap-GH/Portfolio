<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowCross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">TaskFlow Product Health Monitor — Agent Workflow</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">ElevenLabs Agent Workflow · Start → Greeter → 3 Specialists → End · 12 routing conditions</text>

  <!-- Start -->
  <g>
    <rect x="452" y="86" width="96" height="38" rx="19" fill="#0f172a"/>
    <text x="500" y="110" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Start</text>
  </g>
  <line x1="500" y1="124" x2="500" y2="156" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Greeter -->
  <g>
    <rect x="380" y="158" width="240" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="500" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Greeter Subagent</text>
    <text x="500" y="203" text-anchor="middle" font-size="11" fill="#4338ca">Intake router — identifies intent</text>
    <text x="500" y="218" text-anchor="middle" font-size="11" fill="#4338ca">Never answers data questions</text>
  </g>

  <!-- Forward edges from Greeter -->
  <line x1="420" y1="230" x2="180" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="230" x2="500" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="230" x2="820" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="270" y="255" font-size="10" fill="#475569">NPS, reviews, feature</text>
  <text x="270" y="267" font-size="10" fill="#475569">requests, sentiment</text>

  <text x="505" y="258" font-size="10" fill="#475569" text-anchor="middle">tickets, CSAT,</text>
  <text x="505" y="270" font-size="10" fill="#475569" text-anchor="middle">churn risk</text>

  <text x="700" y="255" font-size="10" fill="#475569">DAU/WAU, conversion,</text>
  <text x="700" y="267" font-size="10" fill="#475569">MRR, retention</text>

  <!-- Specialist nodes -->
  <g>
    <rect x="60" y="292" width="240" height="94" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
    <text x="180" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">User Feedback Analyst</text>
    <text x="180" y="337" text-anchor="middle" font-size="10.5" fill="#047857">KB: TaskFlow_User_Feedback_Data</text>
    <text x="180" y="352" text-anchor="middle" font-size="10" fill="#059669">NPS · reviews · interviews</text>
    <text x="180" y="366" text-anchor="middle" font-size="10" fill="#059669">feature requests · in-app feedback</text>
  </g>

  <g>
    <rect x="380" y="292" width="240" height="94" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text x="500" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">Support Ticket Analyst</text>
    <text x="500" y="337" text-anchor="middle" font-size="10.5" fill="#c2410c">KB: TaskFlow_Support_Ticket_Analytics</text>
    <text x="500" y="352" text-anchor="middle" font-size="10" fill="#ea580c">volume · categories · CSAT</text>
    <text x="500" y="366" text-anchor="middle" font-size="10" fill="#ea580c">churn risk · team capacity</text>
  </g>

  <g>
    <rect x="700" y="292" width="240" height="94" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="820" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Product Metrics Analyst</text>
    <text x="820" y="337" text-anchor="middle" font-size="10.5" fill="#1d4ed8">KB: TaskFlow_Product_Metrics</text>
    <text x="820" y="352" text-anchor="middle" font-size="10" fill="#2563eb">DAU/WAU · conversion</text>
    <text x="820" y="366" text-anchor="middle" font-size="10" fill="#2563eb">MRR · retention · perf</text>
  </g>

  <!-- Cross-routing edges (bidirectional, curved) -->
  <path d="M300,320 C 340,300 340,300 380,320" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>
  <path d="M380,352 C 340,372 340,372 300,352" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>

  <path d="M620,320 C 660,300 660,300 700,320" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>
  <path d="M700,352 C 660,372 660,372 620,352" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>

  <path d="M180,386 C 180,440 820,440 820,386" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>
  <path d="M820,392 C 820,452 180,452 180,392" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>

  <text x="500" y="465" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">6 cross-routing edges (dashed) — each specialist can hand off mid-conversation if the topic changes</text>

  <!-- Edges to End -->
  <line x1="180" y1="386" x2="470" y2="560" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="386" x2="500" y2="560" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="820" y1="386" x2="530" y2="560" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="500" y="500" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">"user is done / said goodbye / no more questions" (all 3 specialists)</text>

  <!-- End -->
  <g>
    <rect x="446" y="562" width="108" height="40" rx="20" fill="#0f172a"/>
    <text x="500" y="587" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">End</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 610)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="30" y="4" font-size="10.5" fill="#475569">Forward routing (LLM condition)</text>
    <line x1="260" y1="0" x2="284" y2="0" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowCross)"/>
    <text x="290" y="4" font-size="10.5" fill="#475569">Cross-routing (bidirectional)</text>
  </g>
</svg>
