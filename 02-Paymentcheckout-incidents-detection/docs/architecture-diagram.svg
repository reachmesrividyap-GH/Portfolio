<svg viewBox="0 0 1700 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b78"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d5b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b5482f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="850" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c2b24">Checkout Incident Detection — Two-Agent n8n Pipeline</text>
  <text x="850" y="66" text-anchor="middle" font-size="14" fill="#5a6b60">Agent 1 ingests events in real time · Agent 2 triages on a 15-minute schedule · both share one 4-tab Google Sheet</text>

  <!-- ===================== LANE 1: AGENT 1 ===================== -->
  <rect x="30" y="95" width="1640" height="190" rx="10" fill="#f6f4ee" stroke="#d8d3c4"/>
  <text x="55" y="122" font-size="15" font-weight="700" fill="#2f5233">AGENT 1 — EVENT INGESTION  (webhook · real-time)</text>

  <!-- Test console -->
  <rect x="55" y="150" width="170" height="70" rx="8" fill="#ffffff" stroke="#9aa79f"/>
  <text x="140" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2b24">checkout_event_sender.html</text>
  <text x="140" y="196" text-anchor="middle" font-size="10.5" fill="#6b756f">test console (browser)</text>

  <line x1="225" y1="185" x2="270" y2="185" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="247" y="176" text-anchor="middle" font-size="9.5" fill="#5a6b78">POST</text>

  <!-- Webhook -->
  <rect x="270" y="150" width="150" height="70" rx="8" fill="#eaf3ee" stroke="#4a7c59"/>
  <text x="345" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2b24">IngestionWebhook</text>
  <text x="345" y="197" text-anchor="middle" font-size="10.5" fill="#6b756f">POST /checkout-event</text>

  <line x1="420" y1="185" x2="465" y2="185" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edit fields -->
  <rect x="465" y="150" width="160" height="70" rx="8" fill="#fdf3e3" stroke="#c98a2e"/>
  <text x="545" y="175" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2b24">Edit Fields</text>
  <text x="545" y="192" text-anchor="middle" font-size="10" fill="#6b756f">normalize, uppercase,</text>
  <text x="545" y="205" text-anchor="middle" font-size="10" fill="#6b756f">null-safe defaults</text>

  <line x1="625" y1="185" x2="670" y2="185" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- If -->
  <polygon points="670,185 720,155 770,185 720,215" fill="#fdf3e3" stroke="#c98a2e"/>
  <text x="720" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1c2b24">If:</text>
  <text x="720" y="196" text-anchor="middle" font-size="9.5" fill="#1c2b24">step/value/device valid?</text>

  <!-- true branch -->
  <line x1="770" y1="185" x2="820" y2="185" stroke="#2e7d5b" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="795" y="176" text-anchor="middle" font-size="9.5" fill="#2e7d5b">true</text>
  <rect x="820" y="150" width="170" height="70" rx="8" fill="#eafaf0" stroke="#2e7d5b"/>
  <text x="905" y="175" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2b24">Append row → Sheets</text>
  <text x="905" y="192" text-anchor="middle" font-size="10" fill="#6b756f">Cart Events tab</text>

  <line x1="990" y1="185" x2="1035" y2="185" stroke="#2e7d5b" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="1035" y="150" width="160" height="70" rx="8" fill="#ffffff" stroke="#9aa79f"/>
  <text x="1115" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Respond to Webhook</text>
  <text x="1115" y="196" text-anchor="middle" font-size="10.5" fill="#6b756f">200 · {"status":"recorded"}</text>

  <!-- false branch -->
  <line x1="720" y1="215" x2="720" y2="248" stroke="#b5482f" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="738" y="235" font-size="9.5" fill="#b5482f">false</text>
  <rect x="605" y="248" width="230" height="26" rx="6" fill="#fbeee9" stroke="#b5482f"/>
  <text x="720" y="266" text-anchor="middle" font-size="10.5" fill="#8a3a26">Respond to Webhook · 400 · fixed generic error body</text>

  <!-- ===================== SHARED DATA STORE ===================== -->
  <rect x="30" y="320" width="1640" height="90" rx="10" fill="#eef6f1" stroke="#4a7c59" stroke-dasharray="4 3"/>
  <text x="55" y="345" font-size="15" font-weight="700" fill="#2f5233">SHARED STATE — one Google Sheet, 4 tabs</text>
  <g font-size="11.5" fill="#1c2b24">
    <rect x="55" y="358" width="200" height="34" rx="6" fill="#ffffff" stroke="#9aa79f"/>
    <text x="155" y="379" text-anchor="middle">Cart Events (input)</text>
    <rect x="280" y="358" width="220" height="34" rx="6" fill="#ffffff" stroke="#9aa79f"/>
    <text x="390" y="379" text-anchor="middle">Baseline Metrics (config)</text>
    <rect x="525" y="358" width="200" height="34" rx="6" fill="#ffffff" stroke="#9aa79f"/>
    <text x="625" y="379" text-anchor="middle">State (last_processed_ts)</text>
    <rect x="750" y="358" width="220" height="34" rx="6" fill="#ffffff" stroke="#9aa79f"/>
    <text x="860" y="379" text-anchor="middle">Agent Commands (output)</text>
  </g>

  <!-- connectors from lane 1 down to sheet, and up from lane 2 -->
  <line x1="905" y1="220" x2="905" y2="320" stroke="#2e7d5b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="155" y1="358" x2="155" y2="450" stroke="#2e7d5b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ===================== LANE 2: AGENT 2 ===================== -->
  <rect x="30" y="440" width="1640" height="560" rx="10" fill="#f6f4ee" stroke="#d8d3c4"/>
  <text x="55" y="467" font-size="15" font-weight="700" fill="#2f5233">AGENT 2 — TRIAGE &amp; COMMAND  (schedule · every 15 min)</text>

  <!-- Row 1: trigger through filter -->
  <rect x="55" y="490" width="140" height="65" rx="8" fill="#ffffff" stroke="#9aa79f"/>
  <text x="125" y="517" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Schedule Trigger</text>
  <text x="125" y="534" text-anchor="middle" font-size="10" fill="#6b756f">every 15 min</text>

  <line x1="195" y1="522" x2="235" y2="522" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="235" y="490" width="130" height="65" rx="8" fill="#eaf3ee" stroke="#4a7c59"/>
  <text x="300" y="517" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Read State</text>
  <text x="300" y="534" text-anchor="middle" font-size="10" fill="#6b756f">last_processed_ts</text>

  <line x1="365" y1="522" x2="405" y2="522" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="405" y="490" width="140" height="65" rx="8" fill="#eaf3ee" stroke="#4a7c59"/>
  <text x="475" y="517" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Read Cart Events</text>
  <text x="475" y="534" text-anchor="middle" font-size="10" fill="#6b756f">all rows</text>

  <line x1="545" y1="522" x2="585" y2="522" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585" y="490" width="160" height="65" rx="8" fill="#fdf3e3" stroke="#c98a2e"/>
  <text x="665" y="512" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Filter New Events</text>
  <text x="665" y="529" text-anchor="middle" font-size="10" fill="#6b756f">Code: ts &gt; last_processed</text>
  <text x="665" y="544" text-anchor="middle" font-size="10" fill="#6b756f">idempotency guard</text>

  <line x1="745" y1="522" x2="785" y2="522" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="785,522 830,492 875,522 830,552" fill="#fdf3e3" stroke="#c98a2e"/>
  <text x="830" y="519" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c2b24">If: any</text>
  <text x="830" y="533" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1c2b24">new events?</text>

  <!-- false -> No New Events -->
  <line x1="830" y1="552" x2="830" y2="610" stroke="#b5482f" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="848" y="585" font-size="9.5" fill="#b5482f">false</text>
  <rect x="740" y="610" width="180" height="55" rx="8" fill="#fbeee9" stroke="#b5482f"/>
  <text x="830" y="633" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c2b24">No New Events</text>
  <text x="830" y="649" text-anchor="middle" font-size="9.5" fill="#8a3a26">Code: hardcoded LOG row</text>

  <!-- true -> continue right -->
  <line x1="875" y1="522" x2="915" y2="522" stroke="#2e7d5b" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="895" y="513" text-anchor="middle" font-size="9.5" fill="#2e7d5b">true</text>
  <rect x="915" y="490" width="150" height="65" rx="8" fill="#eaf3ee" stroke="#4a7c59"/>
  <text x="990" y="512" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Read Baseline</text>
  <text x="990" y="527" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Metrics</text>
  <text x="990" y="544" text-anchor="middle" font-size="10" fill="#6b756f">per-step failure rate</text>

  <!-- Row 2: Aggregate -> AI Agent -> Assemble -->
  <line x1="990" y1="555" x2="990" y2="600" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="600" width="220" height="80" rx="8" fill="#fdf3e3" stroke="#c98a2e"/>
  <text x="990" y="624" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2b24">Aggregate Batch (Code)</text>
  <text x="990" y="642" text-anchor="middle" font-size="10" fill="#6b756f">deterministic rules per step:</text>
  <text x="990" y="656" text-anchor="middle" font-size="10" fill="#6b756f">PAYMENT · cart&gt;1500 · exceeds</text>
  <text x="990" y="670" text-anchor="middle" font-size="10" fill="#6b756f">baseline · 2+ mobile fails → HIGH</text>

  <line x1="1100" y1="640" x2="1145" y2="640" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1145" y="600" width="220" height="80" rx="8" fill="#eef1fb" stroke="#4453b8"/>
  <text x="1255" y="622" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2b24">AI Agent + Gemini</text>
  <text x="1255" y="639" text-anchor="middle" font-size="10" fill="#6b756f">writes ONE sentence: "reason"</text>
  <text x="1255" y="653" text-anchor="middle" font-size="10" fill="#6b756f">severity/action already fixed</text>
  <text x="1255" y="667" text-anchor="middle" font-size="10" fill="#6b756f">by the code above — not the LLM</text>

  <line x1="1255" y1="680" x2="1255" y2="720" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1145" y="720" width="220" height="55" rx="8" fill="#fdf3e3" stroke="#c98a2e"/>
  <text x="1255" y="742" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c2b24">Assemble Command Row</text>
  <text x="1255" y="758" text-anchor="middle" font-size="9.5" fill="#6b756f">Code: builds command_id + 9 fields</text>

  <line x1="1145" y1="747" x2="920" y2="747" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="720" width="180" height="55" rx="8" fill="#eafaf0" stroke="#2e7d5b"/>
  <text x="830" y="742" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c2b24">Append row → Sheets</text>
  <text x="830" y="758" text-anchor="middle" font-size="9.5" fill="#6b756f">Agent Commands tab</text>

  <!-- merge point -->
  <line x1="830" y1="665" x2="830" y2="720" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="830" y1="775" x2="830" y2="815" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: fan out to Update State + Slack -->
  <rect x="655" y="815" width="180" height="60" rx="8" fill="#eaf3ee" stroke="#4a7c59"/>
  <text x="745" y="838" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Update State</text>
  <text x="745" y="855" text-anchor="middle" font-size="10" fill="#6b756f">write latest_timestamp</text>

  <rect x="870" y="815" width="200" height="60" rx="8" fill="#f3ecfa" stroke="#7a4fbf"/>
  <text x="970" y="838" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2b24">Slack: Send Message</text>
  <text x="970" y="855" text-anchor="middle" font-size="10" fill="#6b756f">#all-02-portfolioproject</text>

  <line x1="825" y1="775" x2="745" y2="815" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="835" y1="775" x2="970" y2="815" stroke="#5a6b78" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output note -->
  <rect x="1140" y="815" width="360" height="60" rx="8" fill="#ffffff" stroke="#9aa79f"/>
  <text x="1320" y="836" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c2b24">Every run publishes exactly ONE command</text>
  <text x="1320" y="853" text-anchor="middle" font-size="10" fill="#6b756f">ALERT (HIGH) or LOG (LOW) — never zero, never more than one</text>

  <line x1="1070" y1="845" x2="1140" y2="845" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- legend -->
  <g font-size="10.5" fill="#445048">
    <rect x="55" y="905" width="14" height="14" fill="#eaf3ee" stroke="#4a7c59"/><text x="74" y="916">Google Sheets I/O</text>
    <rect x="215" y="905" width="14" height="14" fill="#fdf3e3" stroke="#c98a2e"/><text x="234" y="916">Deterministic Code / logic</text>
    <rect x="420" y="905" width="14" height="14" fill="#eef1fb" stroke="#4453b8"/><text x="439" y="916">LLM (Gemini) — reason text only</text>
    <rect x="680" y="905" width="14" height="14" fill="#f3ecfa" stroke="#7a4fbf"/><text x="699" y="916">Slack notification</text>
    <rect x="850" y="905" width="14" height="14" fill="#ffffff" stroke="#9aa79f"/><text x="869" y="916">Trigger / response / test tool</text>
  </g>

  <text x="850" y="960" text-anchor="middle" font-size="11" fill="#8a938e">Source: 02-n8nIncidentDetectionReasoning.json (n8n Cloud) · Google Gemini Chat Model node, hosted via Google AI Studio key</text>
</svg>
