<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ask Project Bot</title>
<style>
  :root{
    --ink:#1b1f23;
    --paper:#f6f5f1;
    --line:#d8d4c8;
    --accent:#2f5d50;
    --accent-soft:#e4ece9;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:64px 20px;
  }
  main{
    width:100%;
    max-width:640px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:8px;
  }
  h1{
    font-size:28px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  p.sub{
    color:#5b5f63;
    margin:0 0 32px;
    font-size:14px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
  }
  textarea{
    width:100%;
    min-height:96px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-size:15px;
    font-family:inherit;
    resize:vertical;
  }
  textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
  }
  input[type="url"]{
    flex:1;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:var(--mono);
    font-size:12px;
    background:#fff;
  }
  button{
    margin-top:20px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  button:disabled{
    opacity:.5;
    cursor:default;
  }
  button:hover:not(:disabled){
    filter:brightness(1.08);
  }
  #status{
    margin-top:14px;
    font-family:var(--mono);
    font-size:12px;
    color:#5b5f63;
  }
  #answer{
    margin-top:24px;
    padding:18px;
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:6px;
    background:var(--accent-soft);
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
    display:none;
  }
  .badge{
    display:inline-block;
    margin-top:14px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent);
    background:#fff;
    border:1px solid var(--accent);
    border-radius:999px;
    padding:2px 10px;
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Project Status Bot</div>
  <h1>Ask a question</h1>
  <p class="sub">Submits to your n8n workflow. The answer shows here and posts to #n8nflowggoogledrive-projectupdates.</p>

  <label for="webhookUrl">Webhook URL</label>
  <div class="row">
    <input id="webhookUrl" type="url" value="https://ensmedia.app.n8n.cloud/webhook/ask-project-bot">
  </div>

  <label for="question" style="margin-top:24px;">Your question</label>
  <textarea id="question" placeholder="e.g. Which projects are ending in March?"></textarea>

  <button id="sendBtn">Send question</button>
  <div id="status"></div>
  <div id="answer"></div>
</main>

<script>
  const btn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const answerEl = document.getElementById('answer');
  const questionEl = document.getElementById('question');
  const urlEl = document.getElementById('webhookUrl');

  btn.addEventListener('click', async () => {
    const question = questionEl.value.trim();
    const url = urlEl.value.trim();
    if (!question) { statusEl.textContent = 'Type a question first.'; return; }
    if (!url) { statusEl.textContent = 'Webhook URL is required.'; return; }

    btn.disabled = true;
    answerEl.style.display = 'none';
    statusEl.textContent = 'Sending…';

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      if (!res.ok) throw new Error('Server responded with ' + res.status);

      const data = await res.json();
      answerEl.textContent = data.answer || JSON.stringify(data, null, 2);
      answerEl.style.display = 'block';
      statusEl.innerHTML = data.postedToSlack
        ? '<span class="badge">Also posted to Slack</span>'
        : 'Done.';
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  questionEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) btn.click();
  });
</script>
</body>
</html>
