<svg viewBox="0 0 1400 990" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7a4f"/>
    </marker>
  </defs>

  <rect width="1400" height="990" fill="#fafaf8"/>

  <text x="700" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2430">PM Digest — Multi-Agent Orchestration</text>
  <text x="700" y="62" text-anchor="middle" font-size="14" fill="#5b6472">n8n workflow · Slack + Gmail + Calendar → synthesized daily digest</text>

  <!-- LAYER 1: CONTROL -->
  <rect x="40" y="88" width="1320" height="150" rx="10" fill="#eef2fb" stroke="#c3d0ee" stroke-width="1"/>
  <text x="60" y="110" font-size="13" font-weight="700" fill="#2c4a9e" letter-spacing="1">LAYER 1 — CONTROL</text>

  <g>
    <rect x="60" y="128" width="150" height="70" rx="8" fill="#ffffff" stroke="#2c4a9e" stroke-width="1.5"/>
    <text x="135" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Daily 2 PM</text>
    <text x="135" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Trigger</text>
  </g>
  <g>
    <rect x="250" y="128" width="150" height="70" rx="8" fill="#ffffff" stroke="#2c4a9e" stroke-width="1.5"/>
    <text x="325" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Orchestrator</text>
    <text x="325" y="172" text-anchor="middle" font-size="10" fill="#5b6472">config · user profile</text>
  </g>
  <g>
    <rect x="440" y="128" width="150" height="70" rx="8" fill="#ffffff" stroke="#2c4a9e" stroke-width="1.5"/>
    <text x="515" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Guardrails</text>
    <text x="515" y="172" text-anchor="middle" font-size="10" fill="#5b6472">pre-flight checks</text>
  </g>
  <g>
    <rect x="630" y="128" width="150" height="70" rx="8" fill="#ffffff" stroke="#2c4a9e" stroke-width="1.5"/>
    <text x="705" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Read Digest</text>
    <text x="705" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">History</text>
    <text x="705" y="182" text-anchor="middle" font-size="9" fill="#5b6472">Google Sheets</text>
  </g>
  <g>
    <rect x="820" y="128" width="150" height="70" rx="8" fill="#ffffff" stroke="#2c4a9e" stroke-width="1.5"/>
    <text x="895" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">State</text>
    <text x="895" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Management</text>
    <text x="895" y="182" text-anchor="middle" font-size="9" fill="#5b6472">prev. digest context</text>
  </g>
  <g>
    <polygon points="1090,128 1170,163 1090,198 1010,163" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
    <text x="1090" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#5c4400">Already ran</text>
    <text x="1090" y="171" text-anchor="middle" font-size="10" font-weight="600" fill="#5c4400">today?</text>
  </g>
  <text x="1230" y="148" font-size="11" fill="#7a4c00" font-weight="600">true → continue</text>
  <text x="1230" y="166" font-size="11" fill="#7a4c00">false → skip run</text>

  <line x1="210" y1="163" x2="248" y2="163" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="163" x2="438" y2="163" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="163" x2="628" y2="163" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="163" x2="818" y2="163" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="970" y1="163" x2="1008" y2="163" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LAYER 2: EXECUTION -->
  <rect x="40" y="258" width="1320" height="390" rx="10" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1"/>
  <text x="60" y="280" font-size="13" font-weight="700" fill="#1f6b41" letter-spacing="1">LAYER 2 — EXECUTION (3 parallel source agents)</text>

  <!-- Columns: Slack 70-290 (center 180) | Gmail 330-550 (center 440) | Calendar 590-810 (center 700) -->

  <!-- Row A: fetch/search -->
  <g>
    <rect x="70" y="298" width="220" height="52" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="180" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Search Slack Channels</text>
    <text x="180" y="336" text-anchor="middle" font-size="9" fill="#5b6472">slack.com/api search — N msgs</text>
  </g>
  <g>
    <rect x="330" y="298" width="220" height="52" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="440" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Fetch Gmail Emails</text>
    <text x="440" y="336" text-anchor="middle" font-size="9" fill="#5b6472">Gmail API — filtered query</text>
  </g>
  <g>
    <rect x="590" y="298" width="220" height="52" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="700" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Fetch Calendar Events</text>
    <text x="700" y="336" text-anchor="middle" font-size="9" fill="#5b6472">Google Calendar API</text>
  </g>
  <line x1="180" y1="350" x2="180" y2="374" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="350" x2="440" y2="374" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="350" x2="700" y2="450" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row B: aggregate (Slack + Gmail only) -->
  <g>
    <rect x="70" y="376" width="220" height="52" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="180" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Slack Aggregate</text>
    <text x="180" y="414" text-anchor="middle" font-size="9" fill="#5b6472">N items → 1 item (single list)</text>
  </g>
  <g>
    <rect x="330" y="376" width="220" height="52" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="440" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Gmail Aggregate</text>
    <text x="440" y="410" text-anchor="middle" font-size="9" fill="#5b6472">N items → 1 item, then</text>
    <text x="440" y="422" text-anchor="middle" font-size="9" fill="#5b6472">Prepare Gmail Data builds emails_text</text>
  </g>
  <text x="700" y="404" text-anchor="middle" font-size="9" fill="#8a93a1" font-style="italic">(runs per event — no aggregate step)</text>

  <line x1="180" y1="428" x2="180" y2="452" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="428" x2="440" y2="452" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row C: agents -->
  <g>
    <rect x="70" y="454" width="220" height="58" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="180" y="476" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Slack Agent</text>
    <text x="180" y="492" text-anchor="middle" font-size="9" fill="#5b6472">extracts decisions · blockers</text>
    <text x="180" y="504" text-anchor="middle" font-size="9" fill="#5b6472">actions · flags VIP</text>
  </g>
  <g>
    <rect x="330" y="454" width="220" height="58" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="440" y="476" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Gmail Agent</text>
    <text x="440" y="492" text-anchor="middle" font-size="9" fill="#5b6472">triages high-signal emails</text>
    <text x="440" y="504" text-anchor="middle" font-size="9" fill="#5b6472">decisions · approvals · risks</text>
  </g>
  <g>
    <rect x="590" y="454" width="220" height="58" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="700" y="476" text-anchor="middle" font-size="12" font-weight="600" fill="#1e2430">Calendar Agent</text>
    <text x="700" y="492" text-anchor="middle" font-size="9" fill="#5b6472">summarizes events + prep</text>
    <text x="700" y="504" text-anchor="middle" font-size="9" fill="#5b6472">needed</text>
  </g>
  <text x="180" y="527" text-anchor="middle" font-size="10" fill="#5b6472">GPT-4o Mini</text>
  <text x="440" y="527" text-anchor="middle" font-size="10" fill="#5b6472">GPT-4o Mini</text>
  <text x="700" y="527" text-anchor="middle" font-size="10" fill="#5b6472">GPT-4o Mini</text>

  <!-- Row D: merges -->
  <line x1="180" y1="512" x2="180" y2="556" stroke="#5b6472" stroke-width="1.3"/>
  <line x1="180" y1="556" x2="272" y2="556" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="440" y1="512" x2="440" y2="580" stroke="#5b6472" stroke-width="1.3"/>
  <line x1="440" y1="580" x2="272" y2="580" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arrow)"/>

  <g>
    <rect x="275" y="540" width="180" height="56" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="365" y="562" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Merge Gmail + Slack</text>
    <text x="365" y="578" text-anchor="middle" font-size="8" fill="#5b6472">combine by position</text>
    <text x="365" y="590" text-anchor="middle" font-size="8" fill="#5b6472">→ 1 item</text>
  </g>

  <line x1="700" y1="512" x2="700" y2="568" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="455" y1="568" x2="618" y2="568" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arrow)"/>

  <g>
    <rect x="620" y="540" width="180" height="56" rx="8" fill="#ffffff" stroke="#1f6b41" stroke-width="1.5"/>
    <text x="710" y="562" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Merge All Agents</text>
    <text x="710" y="578" text-anchor="middle" font-size="8" fill="#5b6472">combine by position</text>
    <text x="710" y="590" text-anchor="middle" font-size="8" fill="#5b6472">→ 1 item</text>
  </g>

  <!-- Synthesis + Reliability -->
  <rect x="40" y="670" width="820" height="230" rx="10" fill="#fbeef0" stroke="#eec3ca" stroke-width="1"/>
  <text x="60" y="692" font-size="13" font-weight="700" fill="#a02040" letter-spacing="1">SYNTHESIS</text>

  <line x1="710" y1="596" x2="710" y2="630" stroke="#5b6472" stroke-width="1.3"/>
  <line x1="710" y1="630" x2="185" y2="630" stroke="#5b6472" stroke-width="1.3"/>
  <line x1="185" y1="630" x2="185" y2="708" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arrow)"/>

  <g>
    <rect x="70" y="710" width="230" height="60" rx="8" fill="#ffffff" stroke="#a02040" stroke-width="1.5"/>
    <text x="185" y="732" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Aggregate Agent</text>
    <text x="185" y="747" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Outputs</text>
    <text x="185" y="762" text-anchor="middle" font-size="8" fill="#5b6472">merges 3 digests → 1 item</text>
  </g>
  <line x1="300" y1="740" x2="358" y2="740" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="360" y="710" width="230" height="60" rx="8" fill="#ffffff" stroke="#a02040" stroke-width="1.5"/>
    <text x="475" y="733" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Synthesizer Agent</text>
    <text x="475" y="748" text-anchor="middle" font-size="8" fill="#5b6472">dedupe · prioritize · tag New/</text>
    <text x="475" y="759" text-anchor="middle" font-size="8" fill="#5b6472">Recurring/VIP</text>
  </g>
  <text x="475" y="782" text-anchor="middle" font-size="10" fill="#5b6472">GPT-4o (swappable — currently gpt-4o-mini)</text>

  <line x1="590" y1="740" x2="618" y2="740" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="620" y="710" width="120" height="60" rx="8" fill="#ffffff" stroke="#a02040" stroke-width="1.5"/>
    <text x="680" y="735" text-anchor="middle" font-size="10" font-weight="600" fill="#1e2430">Send Digest</text>
    <text x="680" y="748" text-anchor="middle" font-size="10" font-weight="600" fill="#1e2430">to Slack</text>
  </g>

  <line x1="680" y1="770" x2="680" y2="800" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="590" y="802" width="180" height="46" rx="8" fill="#ffffff" stroke="#a02040" stroke-width="1.5"/>
    <text x="680" y="822" text-anchor="middle" font-size="10" font-weight="600" fill="#1e2430">Save Digest to Sheet</text>
    <text x="680" y="836" text-anchor="middle" font-size="8" fill="#5b6472">appends row · feeds next run</text>
  </g>

  <!-- feedback loop, routed around the left/top exterior, straight orthogonal segments -->
  <path d="M590,825 L15,825 L15,78 L705,78 L705,126" fill="none" stroke="#2f7a4f" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="30" y="470" font-size="10" fill="#2f7a4f" font-weight="600" transform="rotate(-90 30 470)">feeds next run's history</text>

  <!-- LAYER 3: RELIABILITY -->
  <rect x="880" y="670" width="480" height="230" rx="10" fill="#fff7e6" stroke="#e8d59f" stroke-width="1"/>
  <text x="900" y="692" font-size="13" font-weight="700" fill="#8a6400" letter-spacing="1">LAYER 3 — RELIABILITY</text>

  <line x1="800" y1="568" x2="1000" y2="568" stroke="#5b6472" stroke-width="1.3"/>
  <line x1="1000" y1="568" x2="1000" y2="708" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arrow)"/>

  <g>
    <rect x="900" y="710" width="200" height="55" rx="8" fill="#ffffff" stroke="#8a6400" stroke-width="1.5"/>
    <text x="1000" y="732" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Error Trigger</text>
    <text x="1000" y="747" text-anchor="middle" font-size="8" fill="#5b6472">fires on any node failure</text>
  </g>
  <line x1="1100" y1="738" x2="1128" y2="738" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="1130" y="710" width="200" height="55" rx="8" fill="#ffffff" stroke="#8a6400" stroke-width="1.5"/>
    <text x="1230" y="730" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">Notify Error</text>
    <text x="1230" y="744" text-anchor="middle" font-size="11" font-weight="600" fill="#1e2430">via Slack</text>
  </g>
  <text x="1000" y="790" font-size="9" fill="#5b6472">Includes failed node name,</text>
  <text x="1000" y="804" font-size="9" fill="#5b6472">error message, timestamp.</text>
  <text x="1000" y="826" font-size="9" fill="#5b6472">"Already ran today?" guard (Layer 1)</text>
  <text x="1000" y="840" font-size="9" fill="#5b6472">prevents duplicate LLM calls</text>
  <text x="1000" y="854" font-size="9" fill="#5b6472">and duplicate sheet rows.</text>

  <!-- Legend -->
  <rect x="40" y="930" width="16" height="16" fill="#eef2fb" stroke="#2c4a9e"/>
  <text x="62" y="943" font-size="11" fill="#1e2430">Control</text>
  <rect x="140" y="930" width="16" height="16" fill="#eafaf1" stroke="#1f6b41"/>
  <text x="162" y="943" font-size="11" fill="#1e2430">Execution</text>
  <rect x="250" y="930" width="16" height="16" fill="#fbeef0" stroke="#a02040"/>
  <text x="272" y="943" font-size="11" fill="#1e2430">Synthesis</text>
  <rect x="360" y="930" width="16" height="16" fill="#fff7e6" stroke="#8a6400"/>
  <text x="382" y="943" font-size="11" fill="#1e2430">Reliability</text>
</svg>
